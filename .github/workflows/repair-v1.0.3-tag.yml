name: Repair v1.0.3 release tag

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  retag-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure v1.0.3 points to the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
          git push origin --delete v1.0.3 || true
          git tag -f v1.0.3 HEAD
          git push origin refs/tags/v1.0.3

      - name: Dispatch the APK build on the v1.0.3 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/dispatches" \
            -d '{"ref":"v1.0.3"}'
